<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Action Flashcards</title><meta name="description" content="Recognizing actions in pictures — flashcards for kids"><meta name="theme-color" content="#7c6aae"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Action Flashcards"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f3ff;color:#2b2340;margin:0;padding:20px;text-align:center}h1{font-size:32px;margin:8px 0} p{color:#6b5f8a}.card{background:#fff;border-radius:24px;max-width:520px;margin:20px auto;padding:28px;box-shadow:0 12px 30px rgba(0,0,0,.12);cursor:pointer;min-height:320px}.pic{font-size:120px}.word{font-size:42px;font-weight:800;margin:12px 0}.hint{color:#8a7fb0}button{font-size:20px;padding:14px 22px;border:0;border-radius:16px;background:#7c6aae;color:#fff;margin:8px;cursor:pointer}button.secondary{background:#e9e3ff;color:#2b2340}.small{font-size:15px;color:#6b5f8a}</style></head><body><h1>🎬 Action Flashcards</h1><p>Look at the picture. What is happening? Tap the card to see the word.</p><div class="card" id="card" onclick="flip()"><div class="pic" id="pic">🏃</div><div class="word" id="word">?</div><div class="hint" id="hint">Tap to reveal</div></div><div><button onclick="prev()">⬅ Back</button><button onclick="next()">Next ➜</button><button class="secondary" onclick="shuffle()">Shuffle</button><button class="secondary" onclick="speak()">🔊 Hear it</button></div><p class="small" id="count"></p><p class="small">Save it like an app: on iPad / iPhone, open in Safari → Share → Add to Home Screen. It opens full-screen.</p><script>const A=[["🏃","running"],["🤾","jumping"],["🍎","eating"],["😴","sleeping"],["📖","reading"],["🏊","swimming"],["🎨","drawing"],["🎵","singing"],["💃","dancing"],["🚲","riding a bike"],["⚽","kicking a ball"],["🧹","cleaning"],["🛁","taking a bath"],["🍳","cooking"],["📞","talking on the phone"],["🎣","fishing"],["🌱","planting"],["✏️","writing"],["🧸","playing"],["🚗","driving"]];let i=0,shown=false;function render(){document.getElementById('pic').textContent=A[i][0];document.getElementById('word').textContent=shown?A[i][1]:'?';document.getElementById('hint').textContent=shown?'Say it out loud!':'Tap to reveal';document.getElementById('count').textContent=(i+1)+' of '+A.length;}function flip(){shown=!shown;render()}function next(){i=(i+1)%A.length;shown=false;render()}function prev(){i=(i-1+A.length)%A.length;shown=false;render()}function shuffle(){A.sort(()=>Math.random()-.5);i=0;shown=false;render()}function speak(){try{speechSynthesis.speak(new SpeechSynthesisUtterance(A[i][1]))}catch(e){}}render();</script></body></html>
